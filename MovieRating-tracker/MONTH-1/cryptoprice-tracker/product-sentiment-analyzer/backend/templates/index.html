<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Sentiment Analyzer & Review Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 9999px;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('search'); // 'search', 'quick', 'custom', 'history'
      const [searchQuery, setSearchQuery] = useState('');
      const [maxReviews, setMaxReviews] = useState(20);
      const [loading, setLoading] = useState(false);
      const [loadingMsg, setLoadingMsg] = useState('');
      const [error, setError] = useState(null);
      const [activeProduct, setActiveProduct] = useState(null);
      const [productsHistory, setProductsHistory] = useState([]);
      const [selectedSentimentFilter, setSelectedSentimentFilter] = useState('all');
      const [keywordFilter, setKeywordFilter] = useState('');
      
      // Quick NLP State
      const [quickText, setQuickText] = useState('');
      const [quickResult, setQuickResult] = useState(null);
      const [quickLoading, setQuickLoading] = useState(false);

      // Custom Paste State
      const [customProductName, setCustomProductName] = useState('');
      const [customReviewsText, setCustomReviewsText] = useState('');

      // Chart Refs
      const sentimentChartRef = useRef(null);
      const ratingChartRef = useRef(null);
      const trendChartRef = useRef(null);
      const keywordChartRef = useRef(null);

      const sentimentChartInstance = useRef(null);
      const ratingChartInstance = useRef(null);
      const trendChartInstance = useRef(null);
      const keywordChartInstance = useRef(null);

      // Load products history on mount
      useEffect(() => {
        fetchProductsHistory();
      }, []);

      const fetchProductsHistory = async () => {
        try {
          const res = await fetch('/api/products');
          const data = await res.json();
          if (data.products && data.products.length > 0) {
            setProductsHistory(data.products);
            // Load the most recent product if none selected
            if (!activeProduct) {
              loadProductDetails(data.products[0].id);
            }
          }
        } catch (err) {
          console.error("Failed to load history", err);
        }
      };

      const loadProductDetails = async (id) => {
        setLoading(true);
        setLoadingMsg('Loading product analytics...');
        setError(null);
        try {
          const res = await fetch(`/api/products/${id}`);
          const data = await res.json();
          if (data.product) {
            setActiveProduct(data);
          } else {
            setError(data.error || "Failed to load product");
          }
        } catch (err) {
          setError("Network error loading product details.");
        } finally {
          setLoading(false);
        }
      };

      const handleAnalyze = async (queryToAnalyze) => {
        const query = queryToAnalyze || searchQuery;
        if (!query.trim()) {
          setError("Please enter a product name or Amazon/Flipkart URL.");
          return;
        }

        setLoading(true);
        setError(null);
        setLoadingMsg('Scraping customer reviews & executing NLP sentiment analysis...');
        
        try {
          const res = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: query.trim(), max_reviews: parseInt(maxReviews) })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setActiveProduct(data);
            fetchProductsHistory();
            setSearchQuery('');
          } else {
            setError(data.error || "Analysis failed. Please try again.");
          }
        } catch (err) {
          setError("Server communication error. Make sure backend is running.");
        } finally {
          setLoading(false);
        }
      };

      const handleQuickAnalyze = async () => {
        if (!quickText.trim()) return;
        setQuickLoading(true);
        try {
          const res = await fetch('/api/sentiment-quick', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: quickText })
          });
          const data = await res.json();
          setQuickResult(data);
        } catch (err) {
          console.error(err);
        } finally {
          setQuickLoading(false);
        }
      };

      const handleCustomIngest = async () => {
        if (!customProductName.trim() || !customReviewsText.trim()) {
          setError("Please provide both a product name and review text lines.");
          return;
        }

        const lines = customReviewsText.split('\n').filter(l => l.trim().length > 0);
        const reviewsPayload = lines.map((line, idx) => ({
          author: `Reviewer #${idx+1}`,
          review_text: line.trim(),
          rating: 4.0,
          title: "Custom Review",
          review_date: "Today"
        }));

        setLoading(true);
        setLoadingMsg('Analyzing custom reviews with VADER & TextBlob NLP...');
        setError(null);

        try {
          const res = await fetch('/api/analyze-custom', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              product_name: customProductName.trim(),
              reviews: reviewsPayload
            })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setActiveProduct(data);
            fetchProductsHistory();
            setCustomReviewsText('');
            setActiveTab('search');
          } else {
            setError(data.error || "Failed to analyze custom reviews.");
          }
        } catch (err) {
          setError("Network error submitting custom reviews.");
        } finally {
          setLoading(false);
        }
      };

      const handleDeleteProduct = async (id, e) => {
        if (e) e.stopPropagation();
        if (!confirm("Are you sure you want to delete this product?")) return;
        try {
          const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
          if (res.ok) {
            if (activeProduct && activeProduct.product.id === id) {
              setActiveProduct(null);
            }
            fetchProductsHistory();
          }
        } catch (err) {
          console.error(err);
        }
      };

      // Render Charts when activeProduct updates
      useEffect(() => {
        if (!activeProduct || !activeProduct.analytics) return;

        const analytics = activeProduct.analytics;

        // 1. Sentiment Donut Chart
        if (sentimentChartRef.current) {
          if (sentimentChartInstance.current) sentimentChartInstance.current.destroy();
          const dist = analytics.sentiment_distribution;
          sentimentChartInstance.current = new Chart(sentimentChartRef.current, {
            type: 'doughnut',
            data: {
              labels: dist.labels,
              datasets: [{
                data: dist.percentages,
                backgroundColor: ['#10b981', '#64748b', '#ef4444'],
                borderWidth: 2,
                borderColor: '#0f172a'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { color: '#cbd5e1', font: { size: 12 } } },
                tooltip: {
                  callbacks: {
                    label: (ctx) => ` ${ctx.label}: ${ctx.raw}% (${dist.counts[ctx.dataIndex]} reviews)`
                  }
                }
              },
              cutout: '70%'
            }
          });
        }

        // 2. Star Rating Distribution Chart
        if (ratingChartRef.current) {
          if (ratingChartInstance.current) ratingChartInstance.current.destroy();
          const rData = analytics.rating_breakdown;
          ratingChartInstance.current = new Chart(ratingChartRef.current, {
            type: 'bar',
            data: {
              labels: rData.stars,
              datasets: [{
                label: 'Reviews',
                data: rData.counts,
                backgroundColor: ['#f59e0b', '#fbbf24', '#fcd34d', '#fed7aa', '#fde047'],
                borderRadius: 6
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false }
              },
              scales: {
                x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                y: { grid: { display: false }, ticks: { color: '#cbd5e1' } }
              }
            }
          });
        }

        // 3. Sentiment Timeline Trend Chart
        if (trendChartRef.current) {
          if (trendChartInstance.current) trendChartInstance.current.destroy();
          const trends = analytics.trends || [];
          trendChartInstance.current = new Chart(trendChartRef.current, {
            type: 'line',
            data: {
              labels: trends.map(t => `#${t.review_num}`),
              datasets: [
                {
                  label: 'Smoothed Sentiment',
                  data: trends.map(t => t.smoothed_sentiment),
                  borderColor: '#6366f1',
                  backgroundColor: 'rgba(99, 102, 241, 0.15)',
                  tension: 0.4,
                  fill: true,
                  borderWidth: 3
                },
                {
                  label: 'Raw Review Compound',
                  data: trends.map(t => t.sentiment_score),
                  borderColor: '#94a3b8',
                  borderDash: [5, 5],
                  pointRadius: 3,
                  pointBackgroundColor: '#e2e8f0',
                  borderWidth: 1,
                  fill: false
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'top', labels: { color: '#cbd5e1' } }
              },
              scales: {
                x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                y: {
                  min: -1,
                  max: 1,
                  grid: { color: '#334155' },
                  ticks: { color: '#94a3b8', callback: (v) => v === 1 ? '+1 (Pos)' : v === -1 ? '-1 (Neg)' : v === 0 ? '0 (Neu)' : v }
                }
              }
            }
          });
        }

        // 4. Keyword / Aspect Frequency Chart
        if (keywordChartRef.current) {
          if (keywordChartInstance.current) keywordChartInstance.current.destroy();
          const posWords = (analytics.keywords?.positive_keywords || []).slice(0, 6);
          const negWords = (analytics.keywords?.negative_keywords || []).slice(0, 6);
          
          const combinedLabels = [...posWords.map(w => '🟢 ' + w.word), ...negWords.map(w => '🔴 ' + w.word)];
          const combinedCounts = [...posWords.map(w => w.count), ...negWords.map(w => w.count)];
          const colors = [...posWords.map(() => '#10b981'), ...negWords.map(() => '#ef4444')];

          keywordChartInstance.current = new Chart(keywordChartRef.current, {
            type: 'bar',
            data: {
              labels: combinedLabels,
              datasets: [{
                label: 'Mentions',
                data: combinedCounts,
                backgroundColor: colors,
                borderRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false }
              },
              scales: {
                x: { grid: { display: false }, ticks: { color: '#cbd5e1' } },
                y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
              }
            }
          });
        }

      }, [activeProduct]);

      // Filtered Reviews computation
      const reviews = activeProduct?.reviews || [];
      const filteredReviews = reviews.filter(r => {
        const matchesSentiment = selectedSentimentFilter === 'all' || r.sentiment_label === selectedSentimentFilter;
        const matchesKeyword = !keywordFilter.trim() || 
          r.review_text.toLowerCase().includes(keywordFilter.toLowerCase()) ||
          r.title.toLowerCase().includes(keywordFilter.toLowerCase()) ||
          r.author.toLowerCase().includes(keywordFilter.toLowerCase());
        return matchesSentiment && matchesKeyword;
      });

      return (
        <div className="flex h-screen overflow-hidden">
          
          {/* Sidebar / History Drawer */}
          <aside className="w-80 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 hidden md:flex">
            {/* Header */}
            <div className="p-5 border-b border-slate-800 flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-emerald-500 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/20">
                📊
              </div>
              <div>
                <h1 className="font-bold text-base tracking-tight leading-tight">SentimentAI</h1>
                <p className="text-xs text-slate-400">Review Intelligence Hub</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="p-3 border-b border-slate-800 grid grid-cols-3 gap-1 bg-slate-950/40 m-3 rounded-xl">
              <button 
                onClick={() => setActiveTab('search')}
                className={`text-xs py-2 font-medium rounded-lg transition ${activeTab === 'search' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                Scraper
              </button>
              <button 
                onClick={() => setActiveTab('quick')}
                className={`text-xs py-2 font-medium rounded-lg transition ${activeTab === 'quick' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                NLP Test
              </button>
              <button 
                onClick={() => setActiveTab('custom')}
                className={`text-xs py-2 font-medium rounded-lg transition ${activeTab === 'custom' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                Upload
              </button>
            </div>

            {/* Analyzed Products List */}
            <div className="flex-1 overflow-y-auto custom-scrollbar px-3 py-2 space-y-2">
              <div className="flex items-center justify-between px-2 pt-2 pb-1">
                <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">Analysis History</span>
                <span className="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-300">{productsHistory.length}</span>
              </div>

              {productsHistory.length === 0 ? (
                <div className="text-center py-8 text-slate-500 text-xs px-4">
                  No products analyzed yet. Search or enter an Amazon/Flipkart URL to get started.
                </div>
              ) : (
                productsHistory.map(p => {
                  const isSelected = activeProduct && activeProduct.product.id === p.id;
                  const sentimentColor = p.sentiment_score >= 0.2 ? 'text-emerald-400' : p.sentiment_score <= -0.2 ? 'text-rose-400' : 'text-amber-400';
                  return (
                    <div 
                      key={p.id}
                      onClick={() => loadProductDetails(p.id)}
                      className={`group p-3 rounded-xl cursor-pointer transition border relative ${
                        isSelected 
                          ? 'bg-indigo-950/50 border-indigo-500/50 shadow-md' 
                          : 'bg-slate-800/40 border-slate-800/80 hover:bg-slate-800/80 hover:border-slate-700'
                      }`}>
                      <div className="flex justify-between items-start">
                        <span className="text-xs font-semibold uppercase px-2 py-0.5 rounded bg-slate-800 text-slate-300">
                          {p.platform}
                        </span>
                        <button 
                          onClick={(e) => handleDeleteProduct(p.id, e)}
                          title="Delete product"
                          className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-400 transition text-xs p-1">
                          ✕
                        </button>
                      </div>
                      <h4 className="font-semibold text-sm text-slate-200 line-clamp-1 mt-1.5">{p.name}</h4>
                      <div className="flex items-center justify-between text-xs mt-2 text-slate-400">
                        <span>⭐ {p.avg_rating} ({p.total_reviews} rev)</span>
                        <span className={`font-semibold ${sentimentColor}`}>
                          {p.positive_percentage}% Pos
                        </span>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            {/* Footer Tech Stack Info */}
            <div className="p-4 border-t border-slate-800 bg-slate-950/60 text-xs text-slate-400 space-y-1">
              <div className="flex justify-between">
                <span>NLP Engine:</span>
                <span className="text-indigo-400 font-mono">VADER + TextBlob</span>
              </div>
              <div className="flex justify-between">
                <span>Scraper:</span>
                <span className="text-emerald-400 font-mono">Selenium / BS4</span>
              </div>
              <div className="flex justify-between">
                <span>Database:</span>
                <span className="text-amber-400 font-mono">SQLAlchemy / SQLite</span>
              </div>
            </div>
          </aside>

          {/* Main Dashboard Area */}
          <main className="flex-1 flex flex-col overflow-hidden bg-slate-950">
            
            {/* Top Bar */}
            <header className="h-16 border-b border-slate-800 px-6 flex items-center justify-between shrink-0 bg-slate-900/60 backdrop-blur-md">
              <div className="flex items-center space-x-3">
                <span className="text-lg font-bold text-white tracking-tight">Product Sentiment Analyzer</span>
                <span className="hidden sm:inline-block px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                  Live NLP Pipeline
                </span>
              </div>

              {/* Action buttons */}
              {activeProduct && (
                <div className="flex items-center space-x-2">
                  <a 
                    href={`/api/export/${activeProduct.product.id}?format=csv`}
                    className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold flex items-center space-x-1.5 transition border border-slate-700">
                    <span>⬇️ Export CSV</span>
                  </a>
                  <a 
                    href={`/api/export/${activeProduct.product.id}?format=json`}
                    className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold flex items-center space-x-1.5 transition border border-slate-700">
                    <span>📦 JSON</span>
                  </a>
                </div>
              )}
            </header>

            {/* Scrollable Content Container */}
            <div className="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-6">

              {/* Error Notice */}
              {error && (
                <div className="p-4 rounded-xl bg-rose-950/50 border border-rose-800/80 text-rose-200 text-sm flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <span className="text-lg">⚠️</span>
                    <span>{error}</span>
                  </div>
                  <button onClick={() => setError(null)} className="text-rose-400 hover:text-white font-bold ml-4">✕</button>
                </div>
              )}

              {/* TAB 1: SEARCH / SCRAPE BAR */}
              {activeTab === 'search' && (
                <div className="glass-card p-5 rounded-2xl space-y-4">
                  <div className="flex flex-col sm:flex-row gap-3">
                    <div className="flex-1 relative">
                      <input 
                        type="text" 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && handleAnalyze()}
                        placeholder="Paste Amazon / Flipkart Product URL or type product name (e.g. Sony WH-1000XM5)..."
                        className="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                      />
                    </div>
                    <div className="flex items-center space-x-2 shrink-0">
                      <select 
                        value={maxReviews}
                        onChange={(e) => setMaxReviews(e.target.value)}
                        className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-sm text-slate-300 focus:outline-none">
                        <option value="10">10 Reviews</option>
                        <option value="20">20 Reviews</option>
                        <option value="35">35 Reviews</option>
                      </select>
                      <button 
                        onClick={() => handleAnalyze()}
                        disabled={loading}
                        className="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 font-semibold text-sm text-white transition flex items-center space-x-2 shadow-lg shadow-indigo-600/30 disabled:opacity-50">
                        {loading ? (
                          <>
                            <span className="animate-spin text-base">⏳</span>
                            <span>Analyzing...</span>
                          </>
                        ) : (
                          <>
                            <span>🔍</span>
                            <span>Scrape & Analyze</span>
                          </>
                        )}
                      </button>
                    </div>
                  </div>

                  {/* Demo Quick Chips */}
                  <div className="flex flex-wrap items-center gap-2 pt-1">
                    <span className="text-xs text-slate-400 font-medium">Quick Demo Prompts:</span>
                    {[
                      "Apple iPhone 15 Pro",
                      "Sony WH-1000XM5 Headphones",
                      "Samsung Galaxy S24 Ultra",
                      "Noise ColorFit Pro Smartwatch"
                    ].map(demo => (
                      <button
                        key={demo}
                        onClick={() => { setSearchQuery(demo); handleAnalyze(demo); }}
                        className="text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700/60 text-indigo-300 transition">
                        + {demo}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 2: LIVE QUICK NLP TESTER */}
              {activeTab === 'quick' && (
                <div className="glass-card p-5 rounded-2xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="font-semibold text-sm text-slate-200">Live Single-Review NLP Classifier</h3>
                    <span className="text-xs text-slate-400">Uses VADER Intensity & TextBlob Polarity</span>
                  </div>
                  <div className="flex flex-col sm:flex-row gap-3">
                    <input 
                      type="text"
                      value={quickText}
                      onChange={(e) => setQuickText(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleQuickAnalyze()}
                      placeholder="Type a sample customer review here (e.g., 'Amazing battery life but the camera is disappointing')..."
                      className="flex-1 bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none"
                    />
                    <button 
                      onClick={handleQuickAnalyze}
                      disabled={quickLoading}
                      className="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold transition">
                      {quickLoading ? 'Scoring...' : 'Score Sentiment'}
                    </button>
                  </div>

                  {quickResult && (
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2">
                      <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800">
                        <span className="text-xs text-slate-400">Predicted Sentiment</span>
                        <div className={`text-base font-bold uppercase mt-1 ${
                          quickResult.sentiment_label === 'positive' ? 'text-emerald-400' :
                          quickResult.sentiment_label === 'negative' ? 'text-rose-400' : 'text-amber-400'
                        }`}>
                          {quickResult.sentiment_label}
                        </div>
                      </div>
                      <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800">
                        <span className="text-xs text-slate-400">VADER Compound</span>
                        <div className="text-base font-bold text-indigo-400 font-mono mt-1">
                          {quickResult.vader_compound}
                        </div>
                      </div>
                      <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800">
                        <span className="text-xs text-slate-400">TextBlob Polarity</span>
                        <div className="text-base font-bold text-sky-400 font-mono mt-1">
                          {quickResult.polarity}
                        </div>
                      </div>
                      <div className="p-3 bg-slate-900/80 rounded-xl border border-slate-800">
                        <span className="text-xs text-slate-400">Subjectivity</span>
                        <div className="text-base font-bold text-violet-400 font-mono mt-1">
                          {quickResult.subjectivity}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 3: CUSTOM INGESTION / CSV TEXT */}
              {activeTab === 'custom' && (
                <div className="glass-card p-5 rounded-2xl space-y-4">
                  <h3 className="font-semibold text-sm text-slate-200">Batch Custom Review Ingestion</h3>
                  <div className="space-y-3">
                    <input 
                      type="text"
                      value={customProductName}
                      onChange={(e) => setCustomProductName(e.target.value)}
                      placeholder="Product Name (e.g. My Custom E-Commerce Product)"
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none"
                    />
                    <textarea 
                      rows="4"
                      value={customReviewsText}
                      onChange={(e) => setCustomReviewsText(e.target.value)}
                      placeholder="Paste review texts (one review per line)&#10;Example:&#10;Great product, fast shipping!&#10;The product arrived broken and customer support was rude.&#10;Average experience, nothing special."
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none font-mono"
                    />
                    <button 
                      onClick={handleCustomIngest}
                      className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold text-sm text-white transition">
                      Process Custom Reviews with NLP
                    </button>
                  </div>
                </div>
              )}

              {/* LOADING STATE */}
              {loading && (
                <div className="p-12 text-center space-y-4">
                  <div className="inline-block w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                  <p className="text-slate-300 font-medium text-sm">{loadingMsg}</p>
                </div>
              )}

              {/* DASHBOARD CONTENT WHEN PRODUCT IS LOADED */}
              {!loading && activeProduct && (
                <div className="space-y-6">

                  {/* Note banner if anti-bot fallback was activated */}
                  {activeProduct.note && (
                    <div className="px-4 py-3 rounded-xl bg-indigo-950/40 border border-indigo-500/30 text-indigo-300 text-xs flex items-center space-x-2">
                      <span>💡</span>
                      <span>{activeProduct.note}</span>
                    </div>
                  )}

                  {/* PRODUCT HERO CARD */}
                  <div className="glass-card p-6 rounded-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6 border-l-4 border-indigo-500">
                    <div className="flex items-center space-x-5">
                      <div className="w-20 h-20 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-3xl overflow-hidden shrink-0">
                        {activeProduct.product.image_url ? (
                          <img src={activeProduct.product.image_url} alt="Product" className="w-full h-full object-cover" />
                        ) : '📦'}
                      </div>
                      <div>
                        <div className="flex items-center space-x-2">
                          <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded bg-indigo-600/30 text-indigo-300 border border-indigo-500/30">
                            {activeProduct.product.platform}
                          </span>
                          {activeProduct.product.price && (
                            <span className="text-xs text-emerald-400 font-semibold font-mono">
                              {activeProduct.product.price}
                            </span>
                          )}
                        </div>
                        <h2 className="text-xl font-bold text-white mt-1.5 leading-snug">{activeProduct.product.name}</h2>
                        <p className="text-xs text-slate-400 mt-1">
                          Scraped on {activeProduct.product.created_at} &bull; {activeProduct.summary.total_reviews} reviews analyzed
                        </p>
                      </div>
                    </div>

                    {/* Overall Sentiment Verdict Pill */}
                    <div className="bg-slate-900/90 border border-slate-800 px-6 py-4 rounded-xl flex items-center space-x-4 shrink-0">
                      <div>
                        <span className="text-xs uppercase tracking-wider text-slate-400 font-medium">Customer Sentiment</span>
                        <div className="flex items-baseline space-x-2 mt-0.5">
                          <span className="text-2xl font-black text-white">
                            {activeProduct.summary.normalized_score ?? Math.round((activeProduct.summary.overall_sentiment_score + 1) * 50)}/100
                          </span>
                          <span className={`text-xs font-bold uppercase ${
                            activeProduct.summary.positive_percentage > 50 ? 'text-emerald-400' :
                            activeProduct.summary.negative_percentage > 40 ? 'text-rose-400' : 'text-amber-400'
                          }`}>
                            {activeProduct.summary.positive_percentage > 50 ? 'Positive Overall' :
                             activeProduct.summary.negative_percentage > 40 ? 'Negative Overall' : 'Mixed / Neutral'}
                          </span>
                        </div>
                      </div>
                      <div className="text-3xl">
                        {activeProduct.summary.positive_percentage > 50 ? '🟢' :
                         activeProduct.summary.negative_percentage > 40 ? '🔴' : '🟡'}
                      </div>
                    </div>
                  </div>

                  {/* KPI SUMMARY CARDS */}
                  <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    
                    {/* Card 1: Positive */}
                    <div className="glass-card p-5 rounded-2xl border-t-2 border-emerald-500">
                      <div className="flex justify-between items-center text-xs text-slate-400">
                        <span>Positive Reviews</span>
                        <span className="text-emerald-400">👍</span>
                      </div>
                      <div className="text-2xl font-black text-emerald-400 mt-2">
                        {activeProduct.summary.positive_percentage}%
                      </div>
                      <span className="text-xs text-slate-400 mt-1 block">
                        {activeProduct.summary.positive_count} satisfied customers
                      </span>
                    </div>

                    {/* Card 2: Neutral */}
                    <div className="glass-card p-5 rounded-2xl border-t-2 border-slate-500">
                      <div className="flex justify-between items-center text-xs text-slate-400">
                        <span>Neutral Reviews</span>
                        <span className="text-slate-400">⚖️</span>
                      </div>
                      <div className="text-2xl font-black text-slate-300 mt-2">
                        {activeProduct.summary.neutral_percentage}%
                      </div>
                      <span className="text-xs text-slate-400 mt-1 block">
                        {activeProduct.summary.neutral_count} balanced opinions
                      </span>
                    </div>

                    {/* Card 3: Negative */}
                    <div className="glass-card p-5 rounded-2xl border-t-2 border-rose-500">
                      <div className="flex justify-between items-center text-xs text-slate-400">
                        <span>Negative Reviews</span>
                        <span className="text-rose-400">👎</span>
                      </div>
                      <div className="text-2xl font-black text-rose-400 mt-2">
                        {activeProduct.summary.negative_percentage}%
                      </div>
                      <span className="text-xs text-slate-400 mt-1 block">
                        {activeProduct.summary.negative_count} complaints noted
                      </span>
                    </div>

                    {/* Card 4: Rating */}
                    <div className="glass-card p-5 rounded-2xl border-t-2 border-amber-500">
                      <div className="flex justify-between items-center text-xs text-slate-400">
                        <span>Average Star Rating</span>
                        <span className="text-amber-400">⭐</span>
                      </div>
                      <div className="text-2xl font-black text-amber-400 mt-2">
                        {activeProduct.summary.avg_rating} / 5.0
                      </div>
                      <span className="text-xs text-slate-400 mt-1 block">
                        Calculated from e-commerce ratings
                      </span>
                    </div>
                  </div>

                  {/* VISUAL ANALYTICS: CHARTS GRID */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

                    {/* Chart 1: Sentiment Distribution */}
                    <div className="glass-card p-5 rounded-2xl">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="font-bold text-sm text-slate-200">Sentiment Distribution</h3>
                        <span className="text-xs text-slate-400">NLP Classification Breakdown</span>
                      </div>
                      <div className="h-64 relative flex items-center justify-center">
                        <canvas ref={sentimentChartRef}></canvas>
                      </div>
                    </div>

                    {/* Chart 2: Star Ratings Breakdown */}
                    <div className="glass-card p-5 rounded-2xl">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="font-bold text-sm text-slate-200">Customer Rating Distribution</h3>
                        <span className="text-xs text-slate-400">5-Star to 1-Star Scale</span>
                      </div>
                      <div className="h-64 relative">
                        <canvas ref={ratingChartRef}></canvas>
                      </div>
                    </div>

                    {/* Chart 3: Sentiment Progression Trend */}
                    <div className="glass-card p-5 rounded-2xl">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="font-bold text-sm text-slate-200">Sentiment Progression Timeline</h3>
                        <span className="text-xs text-slate-400">VADER Compound Moving Avg</span>
                      </div>
                      <div className="h-64 relative">
                        <canvas ref={trendChartRef}></canvas>
                      </div>
                    </div>

                    {/* Chart 4: Aspect / Keyword Frequency */}
                    <div className="glass-card p-5 rounded-2xl">
                      <div className="flex justify-between items-center mb-4">
                        <h3 className="font-bold text-sm text-slate-200">Aspect & Keyword Frequency</h3>
                        <span className="text-xs text-slate-400">🟢 Positive vs 🔴 Critical</span>
                      </div>
                      <div className="h-64 relative">
                        <canvas ref={keywordChartRef}></canvas>
                      </div>
                    </div>
                  </div>

                  {/* REVIEWS EXPLORER */}
                  <div className="glass-card p-6 rounded-2xl space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                      <div>
                        <h3 className="font-bold text-base text-white">Scraped Customer Reviews</h3>
                        <p className="text-xs text-slate-400">Showing {filteredReviews.length} of {reviews.length} reviews</p>
                      </div>

                      {/* Filter Controls */}
                      <div className="flex flex-wrap items-center gap-2">
                        {/* Sentiment Filter Tabs */}
                        <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs">
                          {['all', 'positive', 'neutral', 'negative'].map(type => (
                            <button
                              key={type}
                              onClick={() => setSelectedSentimentFilter(type)}
                              className={`px-3 py-1 rounded-lg font-medium capitalize transition ${
                                selectedSentimentFilter === type 
                                  ? 'bg-indigo-600 text-white shadow' 
                                  : 'text-slate-400 hover:text-white'
                              }`}>
                              {type}
                            </button>
                          ))}
                        </div>

                        {/* Search in reviews */}
                        <input 
                          type="text" 
                          value={keywordFilter}
                          onChange={(e) => setKeywordFilter(e.target.value)}
                          placeholder="Search in reviews..."
                          className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                        />
                      </div>
                    </div>

                    {/* Review Cards List */}
                    <div className="space-y-3 max-h-[500px] overflow-y-auto custom-scrollbar pr-1">
                      {filteredReviews.length === 0 ? (
                        <div className="text-center py-10 text-slate-500 text-sm">
                          No reviews match the selected filter.
                        </div>
                      ) : (
                        filteredReviews.map((rev, i) => {
                          const isPos = rev.sentiment_label === 'positive';
                          const isNeg = rev.sentiment_label === 'negative';
                          const badgeBg = isPos ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                                          isNeg ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' :
                                          'bg-amber-500/10 text-amber-400 border-amber-500/20';
                          return (
                            <div key={i} className="p-4 rounded-xl bg-slate-900/60 border border-slate-800/80 hover:border-slate-700 transition">
                              <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                                <div className="flex items-center space-x-2">
                                  <span className="font-semibold text-sm text-slate-200">{rev.author}</span>
                                  {rev.verified && (
                                    <span className="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20">
                                      ✓ Verified
                                    </span>
                                  )}
                                  <span className="text-xs text-amber-400 font-bold">
                                    {'★'.repeat(Math.round(rev.rating || 5))}
                                  </span>
                                </div>
                                <div className="flex items-center space-x-2">
                                  <span className={`text-xs font-semibold px-2.5 py-0.5 rounded-full border uppercase ${badgeBg}`}>
                                    {rev.sentiment_label} ({rev.vader_compound > 0 ? `+${rev.vader_compound}` : rev.vader_compound})
                                  </span>
                                  {rev.review_date && (
                                    <span className="text-xs text-slate-500">{rev.review_date}</span>
                                  )}
                                </div>
                              </div>
                              {rev.title && (
                                <h5 className="font-semibold text-sm text-white mb-1">{rev.title}</h5>
                              )}
                              <p className="text-sm text-slate-300 leading-relaxed">{rev.review_text}</p>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>

                </div>
              )}

              {/* EMPTY STATE */}
              {!loading && !activeProduct && (
                <div className="glass-card p-12 rounded-3xl text-center max-w-xl mx-auto my-12 space-y-4">
                  <div className="text-5xl">🛍️</div>
                  <h3 className="text-xl font-bold text-white">Welcome to SentimentAI Dashboard</h3>
                  <p className="text-slate-400 text-sm leading-relaxed">
                    Paste an Amazon or Flipkart product URL or type a product name in the search bar above to fetch customer reviews, run real-time NLP sentiment analysis, and view interactive visual analytics.
                  </p>
                  <button 
                    onClick={() => handleAnalyze("Apple iPhone 15 Pro")}
                    className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition">
                    Run Demo on "Apple iPhone 15 Pro"
                  </button>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
